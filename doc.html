<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Estimate · NEVACO BUILD</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Letterhead: white page, black logo top-left, contact top-right, red accent block, red footer bar */
:root{
  --ink:#1d1d1f; --ink2:#5f5f64; --ink3:#9a9aa0; --line:#e3e3e8; --red:#c8102e; --paper:#ffffff; --desk:#ececf0; --green:#1f8a4c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(236,236,240,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.bar button{height:40px;padding:0 18px;border-radius:10px;border:0;font-weight:600;cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bar button.primary{background:var(--ink);color:#fff}
.page{width:8.5in;max-width:100%;min-height:11in;margin:20px auto 40px;background:var(--paper);box-shadow:0 10px 40px rgba(0,0,0,.12);position:relative;display:flex;flex-direction:column}
.accent{position:absolute;left:0;top:0;width:10px;height:150px;background:var(--red)}
.inner{padding:46px 56px 30px;flex:1}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.lh img{width:190px;height:auto;display:block}
.contact{text-align:right;font-size:12px;color:var(--ink2);line-height:1.65}
.contact b{color:var(--ink);font-size:12.5px;letter-spacing:.12em}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:28px 0 22px;flex-wrap:wrap}
.head h1{margin:0;font-size:30px;letter-spacing:.14em;font-weight:700}
.head h1 span{display:block;font-size:13px;letter-spacing:.04em;color:var(--ink2);font-weight:500;margin-top:4px}
.meta{display:grid;grid-template-columns:auto auto;gap:3px 18px;font-size:12.5px}
.meta dt{color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;padding-top:2px}
.meta dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:26px}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--red);font-weight:700;margin-bottom:6px}
.parties p{margin:0;line-height:1.6}
.parties b{font-size:14.5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);text-align:left;padding:0 0 8px;border-bottom:2px solid var(--ink);font-weight:700}
thead th:last-child,td.amt{text-align:right}
td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{width:28px;color:var(--ink3);font-weight:600}
td.desc{white-space:pre-wrap;padding-right:20px}
td.amt{white-space:nowrap;font-weight:600;width:120px}
.totals{margin:16px 0 0 auto;width:300px;max-width:100%}
.totals div{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.totals .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:17px;font-weight:700}
.sched{margin-top:26px;background:#f7f7f9;border-radius:8px;padding:14px 16px}
.sched .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-variant-numeric:tabular-nums}
.block{margin-top:24px}
.block p{margin:0;white-space:pre-wrap;color:var(--ink2)}
.sign{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:28px;page-break-inside:avoid}
.sigline{border-bottom:1px solid var(--ink);height:70px;display:flex;align-items:flex-end;padding-bottom:4px}
.sigline img{max-height:64px;max-width:100%}
.sigcap{font-size:11px;color:var(--ink3);margin-top:5px}
.stamp{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:700;font-size:12px;border:1.5px solid var(--green);border-radius:6px;padding:3px 8px;margin-top:8px}
.paidstamp{display:inline-block;margin-top:18px;border:3px solid var(--green);color:var(--green);font-weight:800;letter-spacing:.12em;font-size:18px;padding:6px 14px;border-radius:8px;transform:rotate(-3deg)}
.sched small{color:var(--ink3)}
.foot{background:var(--red);color:#fff;display:flex;justify-content:space-between;padding:10px 56px;font-size:11px;letter-spacing:.06em}
/* customer accept panel */
.accept{width:8.5in;max-width:calc(100% - 32px);margin:0 auto 40px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.1);padding:24px}
.accept h2{margin:0 0 4px;font-size:20px}
.accept p{margin:0 0 16px;color:var(--ink2)}
.accept label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:12px 0 6px}
.accept input[type=text]{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
.pad{position:relative;border:1px dashed #b9b9c0;border-radius:10px;height:160px;background:#fbfbfc;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:10px}
.pad button{position:absolute;right:8px;top:8px;border:0;background:#eee;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.pad span{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--ink3);pointer-events:none}
.accept label.check{display:flex;font-size:14px;font-weight:400;color:var(--ink);margin:16px 0}
.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.big{width:100%;height:50px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.big:disabled{opacity:.45;cursor:default}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.done{background:#eaf7ef;color:var(--green);border-radius:12px;padding:16px;font-weight:600;text-align:center}
.msg{max-width:480px;margin:18vh auto;text-align:center;padding:24px;color:var(--ink2)}
.msg b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
@media (max-width:700px){
  .page{margin:0 0 20px;box-shadow:none;min-height:0}
  .inner{padding:28px 20px 22px}
  .accent{width:6px;height:100px}
  .lh{flex-direction:column;gap:12px}.contact{text-align:left}
  .lh img{width:150px}
  .head h1{font-size:24px}
  .parties{grid-template-columns:1fr;gap:16px}
  .sign{grid-template-columns:1fr}
  .foot{padding:10px 20px}
  td.amt{width:auto;padding-left:10px}
}
@page{size:letter;margin:0}
@media print{
  body{background:#fff}
  .bar,.accept{display:none!important}
  .page{margin:0;box-shadow:none;width:100%;min-height:100vh}
  .foot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .accent,.sched{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar" id="bar" hidden><button class="primary" id="pdfBtn">Download PDF</button></div>
<div id="root"><div class="msg"><b>Loading…</b></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
const sb=window.supabase.createClient('https://pnomirvkekhurtuigxol.supabase.co','sb_publishable_hZvLBt3e7q6Ycvm1k6yEBA_YMfivV53',{auth:{persistSession:false}});
const $=id=>document.getElementById(id);
const HST_NO=''; // NEVACO BUILD HST registration number, e.g. '123456789 RT0001'
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'$'+Number(v||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const fdate=d=>d?(String(d).length>10?new Date(d):new Date(String(d).slice(0,10)+'T12:00')).toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'}):'';
const qs=new URLSearchParams(location.search),token=qs.get('t')||'';
if(!token){$('root').innerHTML='<div class="msg"><b>Link not valid</b>Please use the link NEVACO BUILD sent you.</div>';return}
let d;
try{const r=await sb.rpc('get_shared_doc',{p_token:token});if(r.error)throw r.error;d=r.data}catch(e){$('root').innerHTML='<div class="msg"><b>Could not load</b>Check your connection and try again.</div>';return}
if(!d){$('root').innerHTML='<div class="msg"><b>Document not found</b>This link may have been replaced. Please contact NEVACO BUILD at 437-432-2252.</div>';return}
const inv=d.kind==='invoice',KIND=inv?'Invoice':'Estimate';
document.title=`${KIND} ${d.number} · NEVACO BUILD`;
const credit=Number(d.credit)||0,due=Math.max(0,Math.round((Number(d.total)-credit)*100)/100),paidInv=inv&&d.status==='paid';
const c=d.customer||{};
const items=(d.items||[]).filter(i=>String(i.d||'').trim());
const priced=items.some(i=>Number(i.a)>0);
const dep=Math.round((Number(d.deposit_pct)||0)*Number(d.total||0))/100;
const accepted=d.status==='accepted';
const place=[c.address,c.city&&!String(c.address||'').toLowerCase().includes(String(c.city).toLowerCase())?c.city:''].filter(Boolean).join(', ');
function render(){
  $('root').innerHTML=`<article class="page">
  <div class="accent"></div>
  <div class="inner">
    <div class="lh"><img src="logo-dark.png" alt="NEVACO BUILD">
      <div class="contact"><b>NEVACO BUILD INC.</b><br>Renovation & General Contracting<br>Toronto, Ontario<br>437-432-2252<br>nevacobuild@gmail.com<br>nevacobuild.ca</div></div>
    <div class="head"><h1>${inv?'INVOICE':'ESTIMATE'}<span>${esc(d.title||(inv?'Renovation Invoice':'Renovation Estimate'))}</span></h1>
      <dl class="meta"><dt>${KIND} no.</dt><dd>${esc(d.number)}</dd><dt>Date</dt><dd>${fdate(d.date)}</dd>${inv?`<dt>Due</dt><dd>${d.due_date&&d.due_date!==d.date?fdate(d.due_date):'On receipt'}</dd>${d.ref?`<dt>Estimate</dt><dd>${esc(d.ref)}</dd>`:''}${HST_NO?`<dt>HST no.</dt><dd>${esc(HST_NO)}</dd>`:''}`:(d.valid_until?`<dt>Valid until</dt><dd>${fdate(d.valid_until)}</dd>`:'')}</dl></div>
    <div class="parties">
      <div><div class="lbl">${inv?'Bill to':'Prepared for'}</div><p><b>${esc(c.name)}</b><br>${esc(place)}${c.phone?'<br>'+esc(c.phone):''}${c.email?'<br>'+esc(c.email):''}</p></div>
      <div><div class="lbl">Project address</div><p>${esc(place)||'—'}</p></div>
    </div>
    <div class="lbl">${inv?'Description':'Scope of work'}</div>
    <table><thead><tr><th style="width:28px">#</th><th>Description</th><th>${priced?'Amount':''}</th></tr></thead>
      <tbody>${items.map((i,k)=>`<tr><td class="n">${k+1}</td><td class="desc">${esc(i.d)}</td><td class="amt">${Number(i.a)>0?money(i.a):''}</td></tr>`).join('')}</tbody></table>
    <div class="totals">
      <div><span>${priced?'Subtotal':'Contract price'}</span><span>${money(d.subtotal)}</span></div>
      ${d.hst?`<div><span>HST (13%)</span><span>${money(d.tax)}</span></div>`:''}
      <div class="${inv&&credit?'':'grand'}"><span>Total${d.hst||inv?'':' (HST not included)'}</span><span>${money(d.total)}${inv&&credit?'':' CAD'}</span></div>
      ${inv&&credit?`<div><span>Less payments received</span><span>−${money(credit)}</span></div><div class="grand"><span>Balance due</span><span>${money(due)} CAD</span></div>`:''}
    </div>
    ${paidInv?`<div class="paidstamp">PAID${d.paid_at?' · '+fdate(d.paid_at):''}${d.paid_method?' · '+esc(d.paid_method):''}</div>`:''}
    ${inv&&!paidInv?`<div class="sched"><div class="lbl">How to pay · ${d.due_date&&d.due_date!==d.date?'due '+fdate(d.due_date):'due on receipt'}</div>
      <div class="row"><span><b>Interac e-Transfer</b> to nevacobuild@gmail.com<br><small>Please include ${esc(d.number)} in the message.</small></span></div>
      <div class="row"><span><b>Cheque</b> payable to NEVACO BUILD INC.</span></div>
      <div class="row"><span><b>Cash</b> · a receipt will be provided</span></div></div>`:''}
    ${!inv&&Number(d.deposit_pct)>0?`<div class="sched"><div class="lbl">Payment schedule</div>
      <div class="row"><span>Deposit at signing (${Number(d.deposit_pct)}%)</span><b>${money(dep)}</b></div>
      <div class="row"><span>Balance on completion</span><b>${money(Number(d.total)-dep)}</b></div></div>`:''}
    ${d.notes?`<div class="block"><div class="lbl">Notes</div><p>${esc(d.notes)}</p></div>`:''}
    ${d.terms?`<div class="block"><div class="lbl">Terms</div><p>${esc(d.terms)}</p></div>`:''}
    ${inv?'<div class="block"><p style="color:var(--ink)">Thank you for choosing NEVACO BUILD.</p></div>':''}
    <div class="sign" ${inv?'hidden':''}>
      <div><div class="sigline">${accepted&&d.signature?`<img src="${esc(d.signature)}" alt="Customer signature">`:''}</div>
        <div class="sigcap">Customer signature${accepted?` · ${esc(d.accepted_name)} · ${fdate(d.accepted_at)}`:''}</div>
        ${accepted?`<div class="stamp">✓ Accepted online ${new Date(d.accepted_at).toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'})}</div>`:''}</div>
      <div><div class="sigline"></div><div class="sigcap">NEVACO BUILD INC.</div></div>
    </div>
  </div>
  <div class="foot"><span>NEVACO BUILD INC. · nevacobuild.ca</span><span>${KIND} ${esc(d.number)}</span></div>
  </article>
  ${d.status==='draft'?`<div class="accept"><div class="done" style="background:#f2f2f5;color:#5f5f64">Draft preview. This ${KIND.toLowerCase()} has not been sent yet.</div></div>`:inv?'':accepted?'<div class="accept"><div class="done">This estimate was accepted. Thank you! NEVACO BUILD will contact you to schedule the work.</div></div>':`
  ${d.status!=='sent'?'':`<form class="accept" id="acc" novalidate>
    <h2>Accept this estimate</h2>
    <p>Review the scope and price above. To accept, type your name and sign below.</p>
    <label for="nm">Full name</label><input type="text" id="nm" autocomplete="name" value="">
    <label>Signature</label><div class="pad"><canvas id="pad"></canvas><button type="button" id="clr">Clear</button><span id="hint">Sign here with your finger or mouse</span></div>
    <label class="check"><input type="checkbox" id="ok"><span>I accept this estimate, including the scope, price, payment schedule and terms above.</span></label>
    <button class="big" id="go" type="submit" disabled>Accept & Sign</button>
    <div class="err" id="err"></div>
  </form>`}`}`;
  $('bar').hidden=false;
  if(!inv&&!accepted&&d.status==='sent')setupPad();
}
function setupPad(){
  const cv=$('pad'),ctx=cv.getContext('2d');let drawing=false,drawn=false,last=null;
  const size=()=>{const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111'};
  size();
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);$('hint').hidden=true});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;drawn=true;check()});
  const end=()=>{drawing=false};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $('clr').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);drawn=false;$('hint').hidden=false;check()};
  const check=()=>{$('go').disabled=!(drawn&&$('ok').checked&&$('nm').value.trim().length>1)};
  $('ok').onchange=check;$('nm').oninput=check;
  $('acc').onsubmit=async e=>{e.preventDefault();check();if($('go').disabled)return;
    $('go').disabled=true;$('go').textContent='Saving…';$('err').textContent='';
    const sig=cv.toDataURL('image/png');
    const r=await sb.rpc('accept_shared_doc',{p_token:token,p_name:$('nm').value.trim(),p_signature:sig});
    if(r.error){$('err').textContent=r.error.message||'Could not save. Please try again.';$('go').disabled=false;$('go').textContent='Accept & Sign';return}
    const again=await sb.rpc('get_shared_doc',{p_token:token});if(again.data)d=again.data;render();window.scrollTo({top:0,behavior:'smooth'})};
}
$('pdfBtn').onclick=()=>window.print();
render();
if(qs.get('print')==='1')setTimeout(()=>window.print(),600);
})();
</script>
</body>
</html>
